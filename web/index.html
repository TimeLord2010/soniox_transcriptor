<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transcrição em tempo real com a API Soniox.">

  <!-- Sem viewport o celular usa o viewport de 980px e escala a página. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!--
    No celular o layout viewport inclui a área ATRÁS da barra do navegador: com
    100vh a tab bar fica obstruída pelos controles do navegador. `dvh` é a altura
    do viewport dinâmico (encolhe junto com a barra) e é o tamanho que o Flutter
    precisa enxergar. `vh` fica como fallback para navegador sem dvh.
    O SafeArea do Flutter não resolve isso: no web `MediaQuery.padding` é zero,
    porque a barra do navegador não é inset do sistema.
  -->
  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f2f2f7;
    }
    flutter-view {
      height: 100vh;
      height: 100dvh;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Soniox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Soniox — transcrição em tempo real</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
