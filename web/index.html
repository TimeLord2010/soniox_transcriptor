<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transcrição em tempo real com a API Soniox.">

  <!-- Sem viewport o celular usa o viewport de 980px e escala a página. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!--
    No celular o layout viewport inclui a área ATRÁS da barra do navegador: com
    100vh a tab bar fica obstruída pelos controles do navegador. `dvh` é a altura
    do viewport dinâmico (encolhe junto com a barra) e é o tamanho que o Flutter
    precisa enxergar. `vh` fica como fallback para navegador sem dvh.
    Sem `overflow: hidden`: o canvas do engine pode ser maior que o container e o
    clipping comia a barra de navegação inferior.
    O SafeArea do Flutter não resolve isso: no web `MediaQuery.padding` é zero,
    porque a barra do navegador não é inset do sistema.
  -->
  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #f2f2f7;
    }
    flutter-view {
      height: 100vh;
      height: 100dvh;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Soniox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Soniox — transcrição em tempo real</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    No celular o Flutter dimensiona a tela pelo LAYOUT viewport (window.inner*),
    que inclui a faixa ATRÁS da barra do navegador: o rodapé do app (a tab bar) e
    a borda direita caem fora da área visível. `visualViewport` é a área que o
    usuário realmente vê — o engine segue o tamanho do elemento `flutter-view`,
    então basta amarrar o elemento a ela.
    Sem isso, `SafeArea` não resolve: no web `MediaQuery.padding` é zero.
  -->
  <script>
    (function () {
      function fit() {
        var vv = window.visualViewport;
        var w = Math.round(vv ? vv.width : window.innerWidth);
        var h = Math.round(vv ? vv.height : window.innerHeight);
        var view = document.querySelector('flutter-view');
        if (!view) return;
        if (view.style.width !== w + 'px') view.style.width = w + 'px';
        if (view.style.height !== h + 'px') view.style.height = h + 'px';
      }
      window.addEventListener('resize', fit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fit);
        window.visualViewport.addEventListener('scroll', fit);
      }
      // O `flutter-view` só existe depois que o engine sobe: procura por um
      // tempo curto em vez de depender de um único evento.
      var tentativas = 0;
      var timer = setInterval(function () {
        fit();
        if (++tentativas > 40) clearInterval(timer);
      }, 250);
    })();
  </script>
</body>
</html>
